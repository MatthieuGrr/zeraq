{% extends "base.html" %}

{# Flux Atom, clé des favoris et balises de partage (Open Graph). #}
{% block extrahead %}
  <meta name="veille:site" content="{{ config.extra.site_key }}">
  <link rel="alternate" type="application/atom+xml" title="{{ config.site_name }}" href="{{ config.site_url }}feed.xml">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:image" content="{{ config.site_url }}assets/social.png">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">
  {% if page %}
    <meta property="og:type" content="{{ 'article' if page.meta.date else 'website' }}">
    <meta property="og:title" content="{{ config.site_name if page.is_homepage else page.title ~ ' · ' ~ config.site_name }}">
    <meta property="og:description" content="{{ page.meta.description or config.site_description }}">
    <meta property="og:url" content="{{ page.canonical_url }}">
    {% if page.meta.date %}<meta property="article:published_time" content="{{ page.meta.date }}">{% endif %}
  {% endif %}
{% endblock %}
