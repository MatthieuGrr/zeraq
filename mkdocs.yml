site_name: Zeraq ⚓
site_description: Veille quotidienne géopolitique, défense et affaires maritimes
site_url: https://zeraq.georger.ovh/
repo_url: https://github.com/MatthieuGrr/zeraq
repo_name: MatthieuGrr/zeraq
copyright: Veille quotidienne · chaque actu renvoie à ses sources originales

theme:
  name: material
  custom_dir: overrides
  # Polices système : aucun appel à Google Fonts.
  font: false
  language: fr
  icon:
    logo: material/anchor
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
    - content.tooltips

plugins:
  - search:
      lang: fr

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/veille.css
  - assets/theme.css
extra:
  # Clé du stockage local des favoris (assets/favoris.js).
  site_key: zeraq
  generator: false
  social:
    - icon: material/rss
      link: /feed.xml
      name: Flux RSS (Atom)
    - icon: fontawesome/brands/github
      link: https://github.com/MatthieuGrr/zeraq
      name: Code source

extra_javascript:
  - assets/favoris.js
  - assets/goatcounter.js

# Les pages de jour ne figurent pas dans la nav : on y accède par l'accueil,
# les archives, les thèmes et les liens précédente/suivante en bas de chaque veille.
not_in_nav: |
  /20*/**
  /themes/**

# La navigation ci-dessous est régénérée par scripts/publish.py : ne pas l'éditer à la main.
# BEGIN NAV
nav:
  - Accueil: index.md
  - Archives: archives.md
  - Thèmes: tags.md
  - Sources: sources.md
  - Favoris: favoris.md
# END NAV
